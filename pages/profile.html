<div class="space-y-8 animate-fade">
    <h2 class="text-3xl font-semibold text-cyan-400 border-b border-gray-700 pb-4">Profil Pengguna</h2>
  
    <div class="grid md:grid-cols-2 gap-8 text-sm">
      
      <!-- Informasi Dasar -->
      <div class="bg-gray-800 p-6 rounded-xl shadow-lg hover:shadow-cyan-500/20 duration-500 transition-all">
        <h3 class="font-bold text-xl text-gray-200 mb-4">Informasi Dasar</h3>
        <p><span class="text-gray-400">Username:</span> <strong>$(username)</strong></p>
        <p><span class="text-gray-400">IP Address:</span> <strong>$(ip)</strong></p>
        <p><span class="text-gray-400">MAC Address:</span> <strong>$(mac)</strong></p>
      </div>
  
      <!-- Koneksi -->
      <div class="bg-gray-800 p-6 rounded-xl shadow-lg hover:shadow-cyan-500/20 duration-500 transition-all">
        <h3 class="font-bold text-xl text-gray-200 mb-4">Koneksi</h3>
        <p><span class="text-gray-400">Uptime:</span> <strong>$(uptime)</strong></p>
        <p><span class="text-gray-400">Download:</span> <strong>$(bytes-out-nice)</strong></p>
        <p><span class="text-gray-400">Upload:</span> <strong>$(bytes-in-nice)</strong></p>
      </div>
  
    </div>
  </div>
