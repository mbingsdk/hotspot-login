<!-- Login Page -->
<div class="flex justify-center items-center p-4 min-h-[calc(100vh-64px-64px)]">
  <!-- Login box -->
  <div class="bg-gray-800 p-8 rounded-xl shadow-lg w-full max-w-md animate-fade hover:shadow-cyan-500/20 transition duration-500">
    <h2 class="text-3xl font-bold mb-6 text-center text-cyan-400">🔐 Login Hotspot</h2>

    <!-- Error Display -->
    <div class="text-center text-red-400 text-sm mb-4">$(if error)$(error)$(endif)</div>

    <!-- FORM LOGIN -->
    <form name="login" method="post" action="$(link-login-only)" class="space-y-6" $(if chap-id) onSubmit="return doLogin()" $(endif)>
      <input type="hidden" name="dst" value="status.html" />
      <input type="hidden" name="popup" value="true" />

      <!-- Username -->
      <div>
        <input name="username" id="username" value="$(username)" class="w-full p-3 bg-gray-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500" placeholder="Username" required />
      </div>

      <!-- Password -->
      <div>
        <input name="password" id="password" type="password" class="w-full p-3 bg-gray-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500" placeholder="Password" required />
      </div>

      <!-- Switch for Auto-Mode -->
      <div class="flex items-center justify-between text-sm text-gray-300">
        <label for="autoMode" class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="autoMode" class="sr-only" />
          <div class="w-10 h-5 bg-gray-600 rounded-full relative transition">
            <div class="dot absolute left-0 top-0 w-5 h-5 bg-white rounded-full transition-transform transform"></div>
          </div>
          Mode Single Field
        </label>
      </div>

      <!-- Submit Button -->
      <div>
        <input type="submit" value="Login" class="w-full bg-cyan-500 hover:bg-cyan-600 text-white p-3 rounded-lg cursor-pointer transition-all duration-300" />
      </div>
    </form>
  </div>
</div>
