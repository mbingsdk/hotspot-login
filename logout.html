<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Logout | SDK-Dev Hotspot</title><link rel="icon" href="assets/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="styles/hotspot.css"></head><body>
<header class="site-header"><div class="header-inner"><a class="brand" href="$(link-login-only)"><img class="brand-logo" src="assets/logo.svg" alt="SDK-Dev"><span class="brand-copy"><strong>SDK-Dev</strong><span>HOTSPOT</span></span></a></div></header>
<main class="simple-center"><section class="card message-card"><span class="message-icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-logout"></use></svg></span><h1>Koneksi selesai</h1><p>Sesi hotspot <strong>$(username)</strong> sudah dihentikan.</p><div class="usage-grid" style="margin-bottom:18px"><div class="usage-card"><div class="usage-head"><span><svg class="icon nav-icon" aria-hidden="true"><use href="assets/icons.svg#i-clock"></use></svg> Uptime</span><strong>$(uptime)</strong></div></div><div class="usage-card"><div class="usage-head"><span><svg class="icon nav-icon" aria-hidden="true"><use href="assets/icons.svg#i-usage"></use></svg> Download / Upload</span><strong>$(bytes-out-nice) / $(bytes-in-nice)</strong></div></div></div><div class="message-actions"><a class="btn btn-primary" href="$(link-login)"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-login"></use></svg><span>Login lagi</span></a><a class="btn btn-secondary" href="paket.html"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-package"></use></svg><span>Lihat paket</span></a></div></section></main></body></html>
