<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">
  <title>Advertisement | SDK-Dev Hotspot</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles/hotspot.css">
</head>
<body>
<header class="site-header"><div class="header-inner">
  <a class="brand" href="$(link-orig)">
    <img class="brand-logo" src="assets/logo.svg" alt="SDK-Dev">
    <span class="brand-copy"><strong>SDK-Dev</strong><span>HOTSPOT</span></span>
  </a>
</div></header>
<main class="simple-center">
  <section class="card message-card">
    <span class="message-icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-info"></use></svg></span>
    <h1>Membuka informasi</h1>
    <p>Anda akan diarahkan kembali secara otomatis setelah halaman informasi dibuka.</p>
    <div class="message-actions">
      <a class="btn btn-primary" href="$(link-redirect)" target="hotspot_advert">Buka sekarang</a>
      <a class="btn btn-secondary" href="$(link-orig)">Kembali</a>
    </div>
  </section>
</main>
<script>
(function(){
  var popup='';
  function openOrig(){ if(window.focus && popup) popup.focus(); location.href=unescape('$(link-orig-esc)'); }
  function openAd(){ location.href=unescape('$(link-redirect-esc)'); }
  if(window.name!=='hotspot_advert'){
    popup=open('$(link-redirect)','hotspot_advert','');
    setTimeout(openOrig,1000);
  }else{
    setTimeout(openAd,1000);
  }
})();
</script>
</body>
</html>
